<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個股分析儀表板</title>
    <style>
        /* 保證顯示的純 CSS 網格與 K 線背景 */
        body {
            background-color: #0b0f19;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(#ef4444, #ef4444), linear-gradient(#ef4444, #ef4444),
                linear-gradient(#22c55e, #22c55e), linear-gradient(#22c55e, #22c55e);
            background-size: 
                40px 40px, 40px 40px, 
                2px 80px, 10px 40px,
                2px 100px, 10px 60px;
            background-position: 
                0 0, 0 0,
                15% 20%, calc(15% - 4px) 30%,
                80% 60%, calc(80% - 4px) 70%;
            background-repeat: repeat;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 2px; }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            width: 300px;
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #ef4444;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .card h2 { color: #ef4444; margin-top: 0; display: flex; justify-content: space-between;}
        .card p { color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>
    <nav>
        <h1>STOCKS<span style="color:#ef4444;">COPE</span> 儀表板</h1>
    </nav>
    <div class="container">
        <!-- 點擊這張卡片就能進入台積電分析頁面 -->
        <a href="2330.html" class="card">
            <h2>台積電 <span>2330</span></h2>
            <p>全球晶圓代工龍頭，先進製程領先者。</p>
            <p style="color:#ef4444; font-weight:bold;">👉 點擊查看深度分析</p>
        </a>
    </div>
</body>
</html>
